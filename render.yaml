services:
  - type: web
    name: glonk-web
    runtime: python
    plan: free
    buildCommand: "cd frontend && npm ci && npm run build && cd ../backend && pip install ."
    startCommand: "cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: glonk-bot
    runtime: python
    plan: free
    buildCommand: "cd backend && pip install ."
    startCommand: "cd backend && python -m bot.main"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: IGDB_CLIENT_ID
        sync: false
      - key: IGDB_CLIENT_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
