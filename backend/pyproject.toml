[project]
name = "glonk-backlog-manager"
version = "0.1.0"
description = "Shared, fluid video game backlog tracker for Discord friend groups"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "authlib>=1.3",
    "httpx>=0.27",
    "itsdangerous>=2.2",
    "discord.py>=2.4",
    "python-multipart>=0.0.12",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
extend-exclude = ["migrations/versions", "migrations/env.py"]

[tool.ruff.lint]
# B008: FastAPI's Depends()-in-default-args is the documented, idiomatic pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "bot"]
